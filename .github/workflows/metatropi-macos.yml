name: Metatropi (macOS)

on:
  push:
    branches: ['**']
    tags: ['metatropi-v*']
    paths:
      - 'metatropi/**'
      - '.github/workflows/metatropi-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metatropi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: DMG ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    defaults:
      run:
        working-directory: metatropi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installa le dipendenze
        run: npm install --no-audit --no-fund

      - name: Installa Rosetta (per la build Intel)
        if: matrix.arch == 'x64'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Prepara i motori (ffmpeg, pandoc, Python, OCR) per macOS ${{ matrix.arch }}
        run: node scripts/fetch-binaries.mjs --platform darwin --arch ${{ matrix.arch }}

      - name: Crea il DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Verifica la firma
        run: |
          APP="$(find dist -maxdepth 2 -name 'Metatropi.app' -type d | head -1)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP/Contents/Resources/bin/ffmpeg"
          codesign -dv "$APP/Contents/Resources/bin/pandoc"
          codesign -dv "$APP/Contents/Resources/bin/ocr"
          codesign -dv "$APP/Contents/Resources/bin/python/bin/python3.12"
          du -sh "$APP" "$APP/Contents/Resources/bin/"*

      - name: Autodiagnosi dell'app impacchettata
        run: |
          APP="$(find dist -maxdepth 2 -name 'Metatropi.app' -type d | head -1)"
          "$APP/Contents/MacOS/Metatropi" --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: Metatropi-macOS-${{ matrix.arch }}
          path: metatropi/dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    name: Pubblica i DMG nella Release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: metatropi/package.json
          sparse-checkout-cone-mode: false

      - name: Leggi la versione
        id: version
        run: echo "version=$(node -p "require('./metatropi/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dmg
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: metatropi-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Metatropi ${{ steps.version.outputs.version }}
          files: dmg/*.dmg
          overwrite_files: true
          make_latest: true
          body: |
            Convertitore universale per macOS che lavora interamente in locale.

            **Scarica il file giusto per il tuo Mac** (menu  → Informazioni su questo Mac):
            - Chip Apple (M1, M2, M3, M4…): `Metatropi-${{ steps.version.outputs.version }}-arm64.dmg`
            - Processore Intel: `Metatropi-${{ steps.version.outputs.version }}-x64.dmg`

            **Installazione:** apri il DMG e trascina Metatropi in Applicazioni.

            **Primo avvio:** l'app non è ancora firmata da Apple, quindi macOS la blocca.
            Vai in Impostazioni di Sistema → Privacy e sicurezza → **Apri comunque**.
            In alternativa, da Terminale: `xattr -dr com.apple.quarantine /Applications/Metatropi.app`
