name: YTGrab macOS app

on:
  push:
    paths:
      - "ytgrab/**"
      - ".github/workflows/ytgrab-mac.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ytgrab-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64), come un Mac M1
    env:
      VERSION: "1.0.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build YTGrab.app + DMG
        run: ytgrab/packaging/build_mac.sh

      - name: Smoke test dell'app impacchettata
        run: |
          APP=ytgrab/dist/YTGrab.app
          "$APP/Contents/MacOS/YTGrab" --server > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:47811/api/doctor && break; sleep 1; done
          echo
          DOC=$(curl -sf http://127.0.0.1:47811/api/doctor)
          echo "$DOC" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['frozen'] and d['ffmpeg'] and 'deno' in (d['js_runtime'] or ''), d; print('OK', d)"
          curl -sf http://127.0.0.1:47811/ | grep -q "<title>YTGrab</title>"

      - name: Prova reale su YouTube (informativa)
        continue-on-error: true
        run: |
          curl -s "http://127.0.0.1:47811/api/search?q=drone%20city%204k&n=5" | python3 -c "
          import json,sys; r=json.load(sys.stdin)
          print(json.dumps(r, indent=1)[:1500])
          open('first_id','w').write(r['results'][0]['id'])"
          ID=$(cat first_id)
          curl -s -X POST http://127.0.0.1:47811/api/download -H 'Content-Type: application/json' \
            -d "{\"id\":\"$ID\",\"title\":\"ci\",\"mode\":\"av\",\"quality\":\"davinci\",\"max_height\":720,\"sections\":[[10,14],[30,33]]}"
          for i in $(seq 1 90); do
            J=$(curl -s http://127.0.0.1:47811/api/jobs)
            echo "$J" | python3 -c "import json,sys; j=json.load(sys.stdin)['jobs'][0]; print(j['state'], j['status'], j['progress'], j['error'], j['files']); sys.exit(0 if j['state'] in ('done','error') else 1)" && break
            sleep 2
          done
          ls -la ~/Movies/YTGrab || true
          for f in ~/Movies/YTGrab/*; do ytgrab/build/mac/bin/ffprobe -v error -show_entries format=duration:stream=codec_name -of compact "$f"; done || true
          cat server.log

      - uses: actions/upload-artifact@v4
        with:
          name: YTGrab-dmg
          path: ytgrab/dist/YTGrab.dmg

      - name: Pubblica la release "ytgrab-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ytgrab-latest --cleanup-tag -y || true
          gh release create ytgrab-latest ytgrab/dist/YTGrab.dmg \
            --target "$GITHUB_SHA" \
            --title "YTGrab $VERSION (Mac Apple Silicon)" \
            --notes "Scarica **YTGrab.dmg**, aprilo e trascina YTGrab in Applicazioni. Al primo avvio: Impostazioni di Sistema → Privacy e sicurezza → Apri comunque."
