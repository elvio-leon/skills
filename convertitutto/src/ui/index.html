<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Convertitutto</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <img src="icon.svg" alt="" class="brand-icon">
      <span class="brand-name">Convertitutto</span>
    </div>
    <div class="tagline">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 2.5 3.8v3.6c0 3.3 2.3 6.2 5.5 7.1 3.2-.9 5.5-3.8 5.5-7.1V3.8L8 1.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="m5.6 8.1 1.6 1.6 3.3-3.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Tutto in locale: i tuoi file non lasciano mai il Mac
    </div>
  </header>

  <main>
    <section id="empty" class="empty">
      <button id="dropzone" class="dropzone" type="button">
        <svg viewBox="0 0 64 64" class="drop-icon" aria-hidden="true">
          <rect x="10" y="6" width="34" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="3"/>
          <rect x="22" y="16" width="34" height="44" rx="5" fill="var(--surface)" stroke="currentColor" stroke-width="3"/>
          <path d="M39 30v18m-7-7 7 7 7-7" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="drop-title">Trascina qui file o cartelle</span>
        <span class="drop-sub">oppure <u>scegli dal Mac</u></span>
      </button>
      <div class="formats" id="formats"></div>
    </section>

    <section id="work" class="work" hidden>
      <div class="toolbar">
        <div class="toolbar-label">Converti tutto in</div>
        <div id="chips" class="chips"></div>
      </div>
      <div class="content">
        <div id="list" class="list" role="list"></div>
        <aside id="options" class="options" aria-label="Opzioni"></aside>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div id="engines" class="engines"></div>
    <div class="actions">
      <button id="add" type="button" class="btn">Aggiungi file…</button>
      <button id="clear" type="button" class="btn" hidden>Svuota elenco</button>
      <button id="cancel" type="button" class="btn danger" hidden>Annulla</button>
      <button id="convert" type="button" class="btn primary" disabled>Converti</button>
    </div>
  </footer>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-box">Rilascia per aggiungere i file</div>
  </div>

  <script src="ui.js"></script>
</body>
</html>
